<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>9.요금제 변경안내팝업_m_6</title>
  <link rel="stylesheet" href="../../css/font.css">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/mngr_component.css">
  <link rel="stylesheet" href="../../css/mngr_contents.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    type="text/css">
</head>


<body>

  <!-- 모바일 전체 Wrap -->
  <div class="m-academy-mngr-Wrap">

  <div class="container">

    <div class="t-popup-wrap">
      <div class="t-popup">


        <div class="pop-body">
          <div class="pop-container">



            <div class="pop-cont ratePlan validator">

              <!-- 팝업닫기 -->
              <button type="button" class="close"></button>


              <div class="vali-box">


              


                <!-- master → basic 요금제 다운 그레이드  “회차 반 운영 중 상태인 경우” -->
                <p class="rateTit">요금제 신청(변경)<br><b class="orange-txt"> Check Point</b></p>

                <ul class="t-bullet-01 contText mb15 pc-text-1">
                  <li>요금제 신청(변경)이 접수 되려면, 현재 운영중인 <b class="orange-txt">“회차 기준 반"</b>이 <b class="orange-txt">종강처리</b> 되어야 합니다. 아래 운영 중인 <b class="orange-txt">“회차 기준 반”</b>을 모두 <b class="orange-txt">종강처리 하신 후</b>, 요금제 변경을 다시 신청해 주세요.</li>
                </ul>

                <div class="box-bg">
                  <b class="fs15 pc-text-1">회차 기준으로 운영중인 반</b>
                  <ul class="t-bullet-01 contText">
                    <li>
                      <span class="pc-text-1">대분류 <span class="pc-grey82">&gt;</span> 중분류 <span
                          class="pc-grey82">&gt;</span> <b>회차 기준 1반</b></span>
                    </li>
                    <li>
                      <span class="pc-text-1">대분류 <span class="pc-grey82">&gt;</span> 중분류 <span
                          class="pc-grey82">&gt;</span><b> 회차 기준 2반</b> 외 <b>00개</b> 반이 <b>회차 기준</b>으로 운영 되고
                        있습니다.</span>
                    </li>
                  </ul>
                  <ul class="gotoList">
                    <li><a>반 관리 메뉴에서 회차 기준반 확인</a></li>
                  </ul>
                </div>

               
                <!-- /master → basic 요금제 다운 그레이드  “회차 반 운영 중 상태인 경우” -->



                <div class="btn-set">
                  <button type="button" class="t-button-sm t-button-grey1">확인</button>
                </div>



              </div>

            </div>



          </div>
        </div>



      </div>


    </div>





      <!-- 팝업 백그라운드 -->
      <div class="m-popup-bg"></div>



</div>



  </div>
  <!-- 모바일 전체 Wrap 끝 -->



</body>

</html>
