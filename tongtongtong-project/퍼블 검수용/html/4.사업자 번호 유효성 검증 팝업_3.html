<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <title>4.사업자 번호 유효성 검증 팝업_3</title>
  <link rel="stylesheet" href="../css/font.css">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/mngr_contents.css">
  <link rel="stylesheet" href="../css/mngr_component.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    type="text/css">
</head>

<body>

  <!-- PC 전체 Wrap -->
  <div class="academy-mngr-Wrap">





    <!-- ●●●●●●●●●●● container 페이지 반복틀(공통영역) 시작 ●●●●●●●●●●● -->
    <div class="container">





      <!-- 페이지 컨텐츠 시작 -->
      <div class="content sub">



        <div class="main-cont">


          <!-- ●●●●●●●●●●● 팝업 영역 시작 ●●●●●●●●●●● -->
          <div class="t-popup-wrap">
            <div class="t-popup ui-draggable" style="width: 600px;">
              <div class="pop-header ui-draggable-handle" style="cursor: move;">
                <p class="pop-title">사업자 등록번호 유효성 인증</p>
              </div>
              <div class="pop-body">
                <div class="pop-container">



                  <div class="pop-cont validator">



                    <div class="vali-box">

                      <div class="contText pc-text-1 first fs14 mb20" style="margin-left: -10px;">· 요금제 신청 및 부가서비스 신청을
                        위해 인증이
                        필요합니다.</div>

                      <div class="pc-text-1 fs13 mb7">사업자 등록증 첨부</div>
                      <div class="input-btn-wrap">
                        <input type="text" placeholder="사업자등록증 파일을 첨부해 주세요. (형식 : pdf, jpg)" readonly="">
                        <input type="file" id="fileChage" style="display: none;">
                        <label for="fileChage" class="t-button-m">파일첨부</label>
                      </div>



                   




                      <!-- 사업자 번호 유효성 검증 (실패) -->
                      <div>
                        <p class="pc-text-1 fs14 h-txt-c mt20 mb20 t-line-hgt20">사업자등록증의 정보를 <b class="pc-orange2">제대로
                            추출하지
                            못했습니다.</b><br>직접 입력 후 홈택스 인증을 진행해 주세요.
                        </p>

                        <div class="box-bg">
                          <ul class="infoList">
                            <li>
                              <span class="fs13 pc-text-1">· 사업자 등록번호</span>
                              <input type="text" class="txtfield-basic" placeholder="사업자 등록번호 입력">
                            </li>
                            <li>
                              <span class="fs13 pc-text-1">· 사업자(학원)</span>
                              <input type="text" class="txtfield-basic" placeholder="사업자(학원) 입력">
                            </li>
                            <li class="flex-start">
                              <span class="fs13 pc-text-1">· 대표자명</span>
                              <div class="inputSet"><input type="text" class="txtfield-basic notEnter"
                                  placeholder=""><span class="pc-orange fs12">공동 대표자인 경우에는, 사업자등록증에 표기된 첫 번째 대표자 성명만 입력해
                                  주세요.</span></div>
                            </li>
                            <li class="flex-start">
                              <span class="fs13 pc-text-1">· 개업 년월일</span>
                              <div class="inputSet"><input type="text" class="txtfield-basic"
                                  placeholder="개업 년월일 숫자 8자리를 입력해 주세요">

                                <span class="pc-orange fs12">입력예시) YYYYMMDD 숫자 8자리를 입력해 주세요.</span></div>
                            </li>
                          </ul>
                        </div>

                        <div class="contText h-txt-c mb20">사업자 유효성 검증 정보를 입력 후 홈택스 <b class="pc-text-1">검증 버튼</b>을 클릭해
                          주세요.
                        </div>
                        <div class="btn-set">
                          <button type="button" class="t-button-sm t-button-grey1 wd134">홈텍스 검증</button>
                        </div>
                      </div>
                      <!-- /사업자 번호 유효성 검증 (실패) -->





                    </div>
                    <!-- /유효성검증 팝업 -->










                  </div>
     





                </div>

              </div>
              <button type="button" class="close" title="팝업 닫기">
                <i class="p-close"></i>
              </button>
            </div>
          </div>




          <!-- 팝업 뒤 배경 -->
          <div class="pop-bg">
          </div>
          <!-- ●●●●●●●●●●● 팝업 영역 끝 ●●●●●●●●●●● -->




        </div>




      </div>
      <!-- 페이지 컨텐츠 끝 -->







    </div>
    <!-- ●●●●●●●●●●● container 페이지 반복틀(공통영역) 끝 ●●●●●●●●●●● -->










  </div>
  <!-- PC 전체 Wrap 끝 -->



</body>

</html>
