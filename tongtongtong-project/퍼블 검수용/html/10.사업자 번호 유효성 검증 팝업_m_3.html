<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>10.사업자 번호 유효성 검증 팝업_m_1</title>
  <link rel="stylesheet" href="../../css/font.css">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/mngr_component.css">
  <link rel="stylesheet" href="../../css/mngr_contents.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    type="text/css">
</head>


<body>

  <!-- 모바일 전체 Wrap -->
  <div class="m-academy-mngr-Wrap">



    <!-- ●●●●●●●●●●● container 페이지 반복틀(공통영역) 시작 ●●●●●●●●●●● -->
    <div class="container">


      <!-- ●●●●●●●●●●● 팝업 영역 시작 ●●●●●●●●●●● -->

      <div class="t-popup-wrap">
        <div class="t-popup popup-goback">
          <div class="pop-header">
            <p class="pop-title">사업자 정보 인증</p>
          </div>
          <div class="pop-body">
            <div class="pop-container">


              <!-- 유효성검증 팝업 -->
              <div class="pop-cont validator">


                <p class="mainTit h-txt-c">사업자 등록번호 <b class="pc-text-1">유효성 인증</b></p>
                <p class="pc-text-1 fs13 text-medium">사업자 등록증 첨부</p>
                <div class="input-btn-wrap">
                  <input type="text" placeholder="사업자 등록증 첨부 (형식 : pdf, jpg, png)" readonly="">
                  <input type="file" id="fileChage" style="display: none;">
                  <label for="fileChage" class="t-button-m">파일첨부</label>
                </div>





                <!-- 사업자 번호 유효성 검증 (실패) -->
                <div>
                  <p class="pc-text-1 fs14 h-txt-c mt20 mb20 t-line-hgt20">사업자등록증의 정보를 <b class="pc-orange2">제대로 추출하지 못했습니다.</b><br>직접 입력 후 <b>홈택스 인증을 진행</b>해 주세요.</p>

                  <div class="box-bg">
                    <ul class="infoList col">
                      <li>
                        <span class="fs13">· 사업자 등록번호</span>
                        <input type="text" class="txtfield-basic" value="220." placeholder="사업자 등록번호 입력">
                      </li>
                      <li>
                        <span class="fs13">· 사업자(학원)</span>
                        <input type="text" class="txtfield-basic" value="홍길동논수" placeholder="사업자(학원) 입력">
                      </li>
                      <li>
                        <span class="fs13">· 대표자</span>
                        <div class="inputSet">
                          <input type="text" class="txtfield-basic notEnter" placeholder="">
                          <span class="pc-orange fs12">공동 대표자인 경우에는, 사업자등록증에 표기된 첫 번째 대표자 성명만 입력해 주세요.</span>
                        </div>
                      </li>
                      <li>
                        <span class="fs13">· 개업 년월일</span>
                        <div class="inputSet">
                          <input type="text" class="txtfield-basic" placeholder="개업 년월일 숫자 8자리를 입력해 주세요">
                          <span class="pc-orange fs12">입력예시) YYYYMMDD 숫자 8자리를 입력해 주세요.</span>
                        </div>
                      </li>
                    </ul>
                  </div>

                  <div class="contText">사업자 유효성 검증 정보를 입력 후 <b class="pc-text-1">홈택스 검증 버튼</b>을 클릭해 주세요.</div>

                </div>
                <!-- /사업자 번호 유효성 검증 (실패) -->



         


              </div>
              <!-- /유효성검증 팝업 -->


            </div>

            <!-- end pop-container-->


            <!-- 필요시 -->
            <div class="bt-btnbox">
              <button type="button" class="registbtn">홈택스 검증</button>
            </div>

            
          </div>

          <button type="button" class="goback"></button>

        </div>
      </div>
      <!-- ●●●●●●●●●●● 팝업 영역 끝 ●●●●●●●●●●● -->






    </div>
    <!-- ●●●●●●●●●●● container 페이지 반복틀(공통영역) 끝 ●●●●●●●●●●● -->





  </div>
  <!-- 모바일 전체 Wrap 끝 -->



</body>

</html>
