<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <title>4.사업자 번호 유효성 검증 팝업_5</title>
  <link rel="stylesheet" href="../css/font.css">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/mngr_contents.css">
  <link rel="stylesheet" href="../css/mngr_component.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    type="text/css">
</head>

<body>

  <!-- PC 전체 Wrap -->
  <div class="academy-mngr-Wrap">





    <!-- ●●●●●●●●●●● container 페이지 반복틀(공통영역) 시작 ●●●●●●●●●●● -->
    <div class="container">





      <!-- 페이지 컨텐츠 시작 -->
      <div class="content sub">



        <div class="main-cont">


          <!-- ●●●●●●●●●●● 팝업 영역 시작 ●●●●●●●●●●● -->
          <div class="t-popup-wrap">
            <div class="t-popup ui-draggable" style="width: 600px;">
              <div class="pop-header ui-draggable-handle" style="cursor: move;">
                <p class="pop-title">사업자 등록번호 유효성 인증</p>
              </div>
              <div class="pop-body">
                <div class="pop-container">


                  <div class="pop-cont validator">





                    <!-- 사업자 번호 유효성 검증(국세청 장애) -->
                    <div class="error">
                      <p class="mainTit">사업자 번호 확인이 일시적으로 지연되고 있습니다.</p>
                      <div class="contText h-txt-c mb20">홈택스 시스템 응답 지연으로 인해 사업자 번호 검증이 원활하지 않습니다.</div>
                      <div class="box-bg">
                        <ul class="t-bullet-01 contText">
                          <li>
                            국세청(홈택스) 시스템과의 연동 과정에서 일시적인 장애로 인해 사업자등록번호 검증요청이 지연되고 있습니다.</li>

                          <li>
                            해당 문제는 홈택스 시스템의 응답 오류가 발생한 것으로, 저희 시스템의 문제가 아닌 점 양해 부탁 드립니다. </li>
                          <li>
                            현재 정상적인 처리를 위해 모니터링 중이며, 홈택스 서비스가 복구되는 즉시 검증이 재시도 됩니다.</li>
                        </ul>
                      </div>
                      <p class="fs14 h-txt-c"><b>잠시 후 다시 이용해 주시기 부탁드립니다.</b></p>
                      <div class="btn-set mt20">
                        <button type="button" class="t-button-m t-button-grey1">닫기</button>
                      </div>
                    </div>
                    <!-- /사업자 번호 유효성 검증(국세청 장애) -->




                  </div>



                </div>

              </div>
              <button type="button" class="close" title="팝업 닫기">
                <i class="p-close"></i>
              </button>
            </div>
          </div>




          <!-- 팝업 뒤 배경 -->
          <div class="pop-bg">
          </div>
          <!-- ●●●●●●●●●●● 팝업 영역 끝 ●●●●●●●●●●● -->




        </div>




      </div>
      <!-- 페이지 컨텐츠 끝 -->







    </div>
    <!-- ●●●●●●●●●●● container 페이지 반복틀(공통영역) 끝 ●●●●●●●●●●● -->










  </div>
  <!-- PC 전체 Wrap 끝 -->




</body>

</html>
