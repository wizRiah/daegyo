<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <title>3.요금제 변경 안내 팝업_6</title>
  <link rel="stylesheet" href="../../css/font.css">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/mngr_component.css">
  <link rel="stylesheet" href="../../css/mngr_contents.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    type="text/css">
</head>

<body>

  <!-- PC 전체 Wrap -->
  <div class="academy-mngr-Wrap">





    <!-- ●●●●●●●●●●● container 페이지 반복틀(공통영역) 시작 ●●●●●●●●●●● -->
    <div class="container">





      <!-- 페이지 컨텐츠 시작 -->
      <div class="content sub">



        <div class="main-cont">


          <!-- ●●●●●●●●●●● 팝업 영역 시작 ●●●●●●●●●●● -->
          <div class="t-popup-wrap" >

            <div class="t-popup ui-draggable" style="width: 460px;">
              <div class="pop-header ui-draggable-handle ttt" style="cursor: move;">
                <p class="pop-title"></p>
              </div>

              <div class="pop-body">
                <div class="pop-container">




                  <!-- 다운 그레이드 요금제 적용 시 “회차 반 운영 중 상태인 경우” -->
                  <div class="pop-cont ratePlan validator">
                    <div class="vali-box">
                      <p class="rateTit">요금제 신청(변경)<b class="orange-txt"> Check Point</b></p>

                      <ul class="t-bullet-01 contText mb20 pc-text-1">
                        <li>요금제 신청(변경)이 접수 되려면, 현재 운영중인 <b class="pc-text-1">“회차 기준 반</b>이 종강처리 되어야 합니다.</li>
                      </ul>

                      <div class="box-bg">
                        <b class="fs15 pc-text-1">회차 기준으로 운영중인 반</b>
                        <ul class="t-bullet-01 contText">
                          <li>
                            <span class="pc-text-1">대분류 <span class="pc-grey82">&gt;</span> 중분류 <span
                                class="pc-grey82">&gt;</span> <b>회차 기준 1반</b></span>
                          </li>
                          <li>
                            <span class="pc-text-1">대분류 <span class="pc-grey82">&gt;</span> 중분류 <span
                                class="pc-grey82">&gt;</span><b> 회차 기준 2반</b> 외 <b>00개</b> 반이 <b>회차 기준</b>으로 운영 되고
                              있습니다.</span>
                          </li>
                        </ul>

                        <button type="button" class="t-button-xs more-arrow2">
                          <i class="more-arrow"></i>
                          <span>반 관리 메뉴에서 회차 기준반 확인</span>
                        </button>

                      </div>


                      <ul class="t-bullet-01 contText mb20 pc-text-1">
                        <li>운영 중인 “회차 기준 반”을 모두 종강처리 하신 후, 요금제 변경을 다시 신청해 주세요.</li>
                      </ul>

                      <div class="btn-set">
                        <button type="button" class="t-button-sm t-button-grey1">확인</button>
                      </div>

                    </div>
                  </div>
                  <!-- /다운 그레이드 요금제 적용 시 “회차 반 운영 중 상태인 경우” -->







                </div>
                <!-- end pop-container-->
              </div>

              <button type="button" class="close" title="팝업 닫기"><i class="p-close"></i></button>


            </div>
          </div>

          


          <!-- 팝업 뒤 배경 -->
          <div class="pop-bg">
          </div>
          <!-- ●●●●●●●●●●● 팝업 영역 끝 ●●●●●●●●●●● -->




        </div>




      </div>
      <!-- 페이지 컨텐츠 끝 -->







    </div>
    <!-- ●●●●●●●●●●● container 페이지 반복틀(공통영역) 끝 ●●●●●●●●●●● -->









  </div>
  <!-- PC 전체 Wrap 끝 -->



</body>

</html>
