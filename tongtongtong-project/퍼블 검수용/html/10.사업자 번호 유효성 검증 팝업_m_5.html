<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>10.사업자 번호 유효성 검증 팝업_m_5</title>
  <link rel="stylesheet" href="../../css/font.css">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/mngr_component.css">
  <link rel="stylesheet" href="../../css/mngr_contents.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    type="text/css">
</head>


<body>

  <!-- 모바일 전체 Wrap -->
  <div class="m-academy-mngr-Wrap">



    <!-- ●●●●●●●●●●● container 페이지 반복틀(공통영역) 시작 ●●●●●●●●●●● -->
    <div class="container">


      <!-- ●●●●●●●●●●● 팝업 영역 시작 ●●●●●●●●●●● -->

      <div class="t-popup-wrap">
        <div class="t-popup popup-goback">
          <div class="pop-header">
            <p class="pop-title">사업자 정보 인증</p>
          </div>
          <div class="pop-body">
            <div class="pop-container">


              <!-- 유효성검증 팝업 -->
              <div class="pop-cont validator">

    


                <!-- 사업자 번호 유효성 검증 (국세청 장애) -->
                <div>
                  <p class="mainTit text-bold pc-text-1 mb15 t-line-hgt30">사업자 번호 확인이 일시적으로 지연되고 있습니다.</p>
                  <div class="contText fs14 h-txt-c mb20">홈택스 시스템 응답 지연으로 인해 사업자 번호 검증이 원활하지 않습니다.</div>
                  <div class="box-bg">
                    <ul class="t-bullet-01 contText grey">
                      <li>
                        국세청(홈택스) 시스템과의 연동 과정에서 일시적인 장애로 인해 사업자등록번호 검증요청이 지연되고 있습니다.</li>

                      <li>
                        해당 문제는 홈택스 시스템의 응답 오류가 발생한 것으로, 저희 시스템의 문제가 아닌 점 양해 부탁 드립니다. </li>
                      <li>
                        현재 정상적인 처리를 위해 모니터링 중이며, 홈택스 서비스가 복구되는 즉시 검증이 재시도 됩니다.</li>
                    </ul>
                  </div>
                  <p class="fs14 h-txt-c">잠시 후 다시 이용해 주시기 부탁드립니다.</p>

                </div>
                <!-- /사업자 번호 유효성 검증 (국세청 장애) -->



  


              </div>
              <!-- /유효성검증 팝업 -->


            </div>

            <!-- end pop-container-->


            <!-- 필요시 -->
            <div class="bt-btnbox">
              <button type="button" class="registbtn">닫기</button>
            </div>

            
          </div>

          <button type="button" class="goback"></button>

        </div>
      </div>
      <!-- ●●●●●●●●●●● 팝업 영역 끝 ●●●●●●●●●●● -->






    </div>
    <!-- ●●●●●●●●●●● container 페이지 반복틀(공통영역) 끝 ●●●●●●●●●●● -->





  </div>
  <!-- 모바일 전체 Wrap 끝 -->



</body>

</html>
