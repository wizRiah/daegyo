<html lang="en" dir="ltr">

<head>

  <title>9.요금제 변경안내팝업_m_4</title>
  <link rel="stylesheet" href="../../css/font.css">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/mngr_component.css">
  <link rel="stylesheet" href="../../css/mngr_contents.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"

<body>

  <!-- 모바일 전체 Wrap -->
  <div class="m-academy-mngr-Wrap">

  <div class="container">

    <div class="t-popup-wrap">
      <div class="t-popup">


        <div class="pop-body">
          <div class="pop-container">



            <div class="pop-cont ratePlan validator">

              <!-- 팝업닫기 -->
              <button type="button" class="close"></button>


              <div class="vali-box">





                <!-- smart 요금제 다운 그레이드 적용 시 -->
                <p class="rateTit"><b class="pt-color">smart</b> 요금제로<br><b class="orange-txt">변경</b>되었습니다.</p>

                <ul class="t-bullet-01 contText mb15">
                  <li><b class="pc-text-1">smart</b>요금제로 변경이 완료되었습니다.</li>
                  <li>해당 월의 남은 잔여기간은 이용중인 <b class="pc-text-1">master</b>요금제가 유지되고, 익월 1일부터 <b class="pc-text-1">smart
                      요금제로 변경</b>됩니다.</li>
                </ul>

                <div class="box-bg mb10">
                  <p class="fs15 pc-text-1">smart 요금제 적용일 : <b> 익월 1일 </b>
                    <span class="orange-txt">(예상일 25년 9월 1일)</span>
                  </p>
                </div>

                <div class="box-bg">
                  <b class="fs15 pc-text-1">더 이상 사용할 수 없는 기능</b>
                  <ul class="gotoList">
                    <li><a>수강료 분납 바로가기</a></li>
                    <li><a>앨범 기능 바로가기</a></li>
                  </ul>
                </div>
                <!-- /smart 요금제 다운 그레이드 적용 시 -->





                <div class="btn-set">
                  <button type="button" class="t-button-sm t-button-grey1">확인</button>
                </div>



              </div>

            </div>



          </div>
        </div>



      </div>


    </div>





      <!-- 팝업 백그라운드 -->
      <div class="m-popup-bg"></div>



</div>



  </div>
