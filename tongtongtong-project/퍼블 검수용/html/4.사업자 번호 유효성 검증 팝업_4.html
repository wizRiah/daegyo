<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>4.사업자 번호 유효성 검증 팝업_4</title>
  <link rel="stylesheet" href="../../css/font.css">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/mngr_component.css">
  <link rel="stylesheet" href="../../css/mngr_contents.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    type="text/css">
</head>

<body>
  <!-- PC 전체 Wrap -->
  <div class="academy-mngr-Wrap">





    <!-- ●●●●●●●●●●● container 페이지 반복틀(공통영역) 시작 ●●●●●●●●●●● -->
    <div class="container">





      <!-- 페이지 컨텐츠 시작 -->
      <div class="content sub">



        <div class="main-cont">


          <!-- ●●●●●●●●●●● 팝업 영역 시작 ●●●●●●●●●●● -->
          <div class="t-popup-wrap">
            <div class="t-popup ui-draggable" style="width: 600px;">
              <div class="pop-header ui-draggable-handle" style="cursor: move;">
                <p class="pop-title">사업자 등록번호 유효성 인증</p>
              </div>
              <div class="pop-body">
                <div class="pop-container">


                  <div class="pop-cont validator">



                    <div class="vali-box">

                      <div class="contText pc-text-1 first fs14 mb20" style="margin-left: -10px;">· 요금제 신청 및 부가서비스 신청을
                        위해 인증이
                        필요합니다.</div>

                      <div class="pc-text-1 fs13 mb7">사업자 등록증 첨부</div>
                      <div class="input-btn-wrap">
                        <input type="text" placeholder="사업자등록증 파일을 첨부해 주세요. (형식 : pdf, jpg)" readonly="">
                        <input type="file" id="fileChage" style="display: none;">
                        <label for="fileChage" class="t-button-m">파일첨부</label>
                      </div>





                      <!-- 사업자 번호 유효성 검증 (휴업,폐업) -->
                      <div>
                        <p class="pc-text-1 fs14 h-txt-c mt20 mb20 t-line-hgt20">사업자 유효성 검증결과, 해당 사업자는 <b
                            class="pc-orange2">휴업 상태</b>의 사업자로 홈택스에서 확인됩니다.</p>
                        <div class="contText bd-g mb30">· 통통통은 홈택스에서 제공하는 API를 통해 검증만 할 뿐입니다.
                          <br> · 업자 정보에 이슈가 없는 경우, 홈택스 (<a href="https://hometax.go.kr/" title="새창열림"
                            target="_blank">https://hometax.go.kr/</a>)에서 직접 확인하셔야 합니다.
                        </div>
                        <div class="btn-set">
                          <button type="button" class="t-button-m t-button-grey1">확인</button>
                        </div>
                      </div>
                      <!-- /사업자 번호 유효성 검증 (휴업,폐업) -->





                    </div>
                    <!-- /유효성검증 팝업 -->







                  </div>

                
                </div>

              </div>
              <button type="button" class="close" title="팝업 닫기">
                <i class="p-close"></i>
              </button>
            </div>
          </div>




          <!-- 팝업 뒤 배경 -->
          <div class="pop-bg">
          </div>
          <!-- ●●●●●●●●●●● 팝업 영역 끝 ●●●●●●●●●●● -->




        </div>




      </div>
      <!-- 페이지 컨텐츠 끝 -->







    </div>
    <!-- ●●●●●●●●●●● container 페이지 반복틀(공통영역) 끝 ●●●●●●●●●●● -->










  </div>
  <!-- PC 전체 Wrap 끝 -->



</body>

</html>
