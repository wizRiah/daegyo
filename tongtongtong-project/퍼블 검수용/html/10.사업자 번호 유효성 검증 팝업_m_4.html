<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>10.사업자 번호 유효성 검증 팝업_m_4</title>
  <link rel="stylesheet" href="../../css/font.css">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/mngr_component.css">
  <link rel="stylesheet" href="../../css/mngr_contents.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    type="text/css">
</head>


<body>

  <!-- 모바일 전체 Wrap -->
  <div class="m-academy-mngr-Wrap">



    <!-- ●●●●●●●●●●● container 페이지 반복틀(공통영역) 시작 ●●●●●●●●●●● -->
    <div class="container">


      <!-- ●●●●●●●●●●● 팝업 영역 시작 ●●●●●●●●●●● -->

      <div class="t-popup-wrap">
        <div class="t-popup popup-goback">
          <div class="pop-header">
            <p class="pop-title">사업자 정보 인증</p>
          </div>
          <div class="pop-body">
            <div class="pop-container">


              <!-- 유효성검증 팝업 -->
              <div class="pop-cont validator">


                <p class="mainTit h-txt-c">사업자 등록번호 <b class="pc-text-1">유효성 인증</b></p>
                <p class="pc-text-1 fs13 text-medium">사업자 등록증 첨부</p>
                <div class="input-btn-wrap">
                  <input type="text" placeholder="사업자 등록증 첨부 (형식 : pdf, jpg, png)" readonly="">
                  <input type="file" id="fileChage" style="display: none;">
                  <label for="fileChage" class="t-button-m">파일첨부</label>
                </div>



                <!-- 사업자 번호 유효성 검증 (휴업,폐업) -->
                <div>
                  <p class="pc-text-1 fs14 h-txt-c mt20 mb20 t-line-hgt20">사업자 유효성 검증결과, 해당 사업자는 <b
                      class="pc-orange2">휴업 상태</b>의 사업자로 홈택스에서 확인됩니다.</p>
                  <ul class="t-bullet-01 contText bd-g">
                    <li>통통통은 홈택스에서 제공하는 API를 통해 검증만 할 뿐입니다.
                    </li>

                    <li>업자 정보에 이슈가 없는 경우, 홈택스 (<a href="https://hometax.go.kr/" title="새창열림"
                        target="_blank">https://hometax.go.kr/</a>)에서 직접 확인하셔야 합니다.
                    </li>

                  </ul>

                </div>
                <!-- /사업자 번호 유효성 검증 (휴업,폐업) -->





              </div>
              <!-- /유효성검증 팝업 -->


            </div>

            <!-- end pop-container-->


            
          </div>

          <button type="button" class="goback"></button>

        </div>
      </div>
      <!-- ●●●●●●●●●●● 팝업 영역 끝 ●●●●●●●●●●● -->






    </div>
    <!-- ●●●●●●●●●●● container 페이지 반복틀(공통영역) 끝 ●●●●●●●●●●● -->





  </div>
  <!-- 모바일 전체 Wrap 끝 -->



</body>

</html>
