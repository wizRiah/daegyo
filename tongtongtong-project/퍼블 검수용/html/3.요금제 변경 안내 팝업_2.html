<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <title>3.요금제 변경 안내 팝업_2</title>
  <link rel="stylesheet" href="../../css/font.css">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/mngr_component.css">
  <link rel="stylesheet" href="../../css/mngr_contents.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    type="text/css">
</head>

<body>

  <!-- PC 전체 Wrap -->
  <div class="academy-mngr-Wrap">


   

    <!-- ●●●●●●●●●●● container 페이지 반복틀(공통영역) 시작 ●●●●●●●●●●● -->
    <div class="container">





      <!-- 페이지 컨텐츠 시작 -->
      <div class="content sub">



        <div class="main-cont">


          <!-- ●●●●●●●●●●● 팝업 영역 시작 ●●●●●●●●●●● -->
          <div class="t-popup-wrap" >

            <div class="t-popup ui-draggable" style="width: 460px;">
              <div class="pop-header ui-draggable-handle ttt" style="cursor: move;">
                <p class="pop-title"></p>
              </div>

              <div class="pop-body">
                <div class="pop-container">



                  <!-- master 요금제 업그레이드 적용시 -->
                  <div class="pop-cont ratePlan validator">
                    <div class="vali-box">
                      <p class="rateTit"><b class="pt-color">master </b>요금제로 <b class="orange-txt">변경</b>되었습니다.</p>

                      <ul class="t-bullet-01 contText mb20">
                        <li><b class="pc-text-1">master</b>요금제로 변경이 완료되어 지금부터 <b class="pc-text-1">master </b> 요금제에서만
                          이용되는 특별한
                          기능을 사용하실 수 있습니다.</li>
                        <li> 사용 비용은 신청 당일부터 말일까지는 무료로 사용이 가능하며, 익월 청구서에 <b class="pc-text-1">master</b>요금이 청구됩니다.</li>
                      </ul>

                      <div class="box-bg">
                        <b class="fs15 pc-text-1">master 요금제 차별화된 기능</b>
                        <ul class="infoList serviceIn fs13">
                          <li>
                            <span class="pc-text-1">· 수강료 분납</span>
                            <button type="button" class="t-button-underline t-button-nobg">바로가기</button>
                          </li>
                          <li>
                            <span class="pc-text-1">· 반별 출결 처리 설정</span>
                            <button type="button" class="t-button-underline t-button-nobg">바로가기</button>
                          </li>
                          <li>
                            <span class="pc-text-1">· 앨범 기능 확인</span>
                            <button type="button" class="t-button-underline t-button-nobg">바로가기</button>
                          </li>
                        </ul>
                      </div>

                      <div class="btn-set">
                        <button type="button" class="t-button-sm t-button-grey1">확인</button>
                      </div>

                    </div>
                  </div>
                  <!-- /master 요금제 업그레이드 적용시 -->



                </div>
                <!-- end pop-container-->
              </div>

              <button type="button" class="close" title="팝업 닫기"><i class="p-close"></i></button>


            </div>
          </div>

          


          <!-- 팝업 뒤 배경 -->
          <div class="pop-bg">
          </div>
          <!-- ●●●●●●●●●●● 팝업 영역 끝 ●●●●●●●●●●● -->




        </div>




      </div>
      <!-- 페이지 컨텐츠 끝 -->







    </div>
    <!-- ●●●●●●●●●●● container 페이지 반복틀(공통영역) 끝 ●●●●●●●●●●● -->






  </div>
  <!-- PC 전체 Wrap 끝 -->



</body>

</html>
