<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <title></title>
  <link rel="stylesheet" href="../../css/font.css">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/mngr_component.css">
  <link rel="stylesheet" href="../../css/mngr_contents.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    type="text/css">
</head>

<body>

  <!-- PC 전체 Wrap -->
  <div class="academy-mngr-Wrap">


    <!-- ●●●●●●●●●●● 팝업 영역 시작 ●●●●●●●●●●● -->
    <div class="t-popup-wrap" style="top: 0px; left: 0px;">

      <div class="t-popup ui-draggable" style="width: 900px;">
        <div class="pop-header ui-draggable-handle ttt" style="cursor: move;">
          <p class="pop-title"></p>
        </div>

        <div class="pop-body">
          <div class="pop-container">




            <!-- 팝업 틀에 여기부터 넣어주세여 -->
            <div class="pop-cont ratePlan billWrap">
              <p class="billTit mb20 h-txt-c"><b>2025.11월 </b>총 납부금액은 <b class="orange-txt">170,040</b>원 입니다.</p>
              <section>
                <table class="bill-table">
                  <thead>
                    <tr>
                      <th style="width: 210px;">구분</th>
                      <th style="width: 120px;">사용금액</th>
                      <th style="width: 190px;">할인(면제)금액</th>
                      <th style="width: 120px;">당월 납부금액</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr class="plan">
                      <td>Next Plan</td>
                      <td class="h-txt-r"><b>14,920</b> 원</td>
                      <td></td>
                      <td class="h-txt-r"><b class="yellow">14,920</b> 원</td>
                    </tr>
                    <tr class="package">
                      <td>수납 패키지 A타입</td>
                      <td class="h-txt-r"><b>14,920</b> 원</td>
                      <td></td>
                      <td class="h-txt-r"><b class="yellow">14,920</b> 원</td>
                    </tr>
                    <tr class="package">
                      <td>출결 패키지</td>
                      <td class="h-txt-r"><b>14,920</b> 원</td>
                      <td></td>
                      <td class="h-txt-r"><b class="yellow">14,920</b> 원</td>
                    </tr>
                    <tr class="option">
                      <td>비대면 간편결제(후불/유료)<br>(적용기간 : 2025.09.01 ~ 09.30)</td>
                      <td class="h-txt-r"><b>14,920</b> 원</td>
                      <td></td>
                      <td class="h-txt-r"><b class="yellow">14,920</b> 원</td>
                    </tr>
                    <tr class="option">
                      <td>신용카드 단말기 연동</td>
                      <td class="h-txt-r"><b>14,920</b> 원</td>
                      <td></td>
                      <td class="h-txt-r"><b class="yellow">14,920</b> 원</td>
                    </tr>
                    <tr class="option">
                      <td>자동청구서 생성</td>
                      <td class="h-txt-r"><b>14,920</b> 원</td>
                      <td></td>
                      <td class="h-txt-r"><b class="yellow">14,920</b> 원</td>
                    </tr>
                  </tbody>
                </table>
              </section>
            </div>
            <!-- /팝업 틀에 여기부터 넣어주세여 -->






          </div>
          <!-- end pop-container-->
        </div>

        <button type="button" class="close" title="팝업 닫기"><i class="p-close"></i></button>


      </div>
    </div>


    <!-- 팝업 뒤 배경 -->
    <div class="pop-bg">
    </div>
    <!-- ●●●●●●●●●●● 팝업 영역 끝 ●●●●●●●●●●● -->





  </div>
  <!-- PC 전체 Wrap 끝 -->



</body>

</html>
