<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>웹스토리지_요금제서비스안내 팝업</title>
  <link rel="stylesheet" href="../../css/font.css">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/mngr_component.css">
  <link rel="stylesheet" href="../../css/mngr_contents.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    type="text/css">
</head>

<body>

  <!-- PC 전체 Wrap -->
  <div class="academy-mngr-Wrap">


    <div class="t-popup-wrap">
      <div class="t-popup ui-draggable" style="width: 560px;">
        <div class="pop-header ui-draggable-handle" style="cursor: move;border: 0;">
          <p class="pop-title">요금제 서비스 안내</p>
        </div>
        <div class="pop-body">
          <div class="pop-container">


            <!-- 팝업 컴포넌트에 여기부터 넣어주세여 -->
            <!-- pc 팝업만 width값 560px로 지정해주세용 -->
            <div class="pop-cont new storage">
              <p class="main-tit mb20">웹 스토리지 서비스를 이용해 주셔서 감사합니다.</p>
              <div class="box-bg">
                <ul class="t-bullet-01 contText mb20">
                  <li class="t-line-hgt20">앨범 서비스 이용 하시면 우리 원의 다양한 활동을 사진으로 남길 수 있습니다. </li>          
                  <li class="t-line-hgt20">Master 요금제를 이용하시면 웹 스토리지 서비스를 보다 다양하게 이용하실 수 있습니다.</li>
                  <li class="t-line-hgt20">Master 요금제의 자세한 내용이 궁금하시면 아래 "요금제 안내"를 클릭하시기 바랍니다.</li>
                </ul>
                <button type="button" class="t-button-xs more-arrow2">
                  <i class="more-arrow"></i>
                  <span>요금제 안내</span>
                </button>
              </div>

              <div class="btn-set">
                <button type="button" class="t-button-m t-button-grey1">확인</button>
              </div>
              
            </div>
            <!-- /팝업 컴포넌트에 여기부터 넣어주세여 -->


          </div>

        </div>
        <button type="button" class="close" title="팝업 닫기">
          <i class="p-close"></i>
        </button>
      </div>
    </div>


    <!-- 팝업 뒤 배경 -->
    <div class="pop-bg">
    </div>
    <!-- ●●●●●●●●●●● 팝업 영역 끝 ●●●●●●●●●●● -->





  </div>
  <!-- PC 전체 Wrap 끝 -->



</body>

</html>
