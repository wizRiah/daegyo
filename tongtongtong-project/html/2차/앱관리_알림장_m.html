<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>앱관리_알림장_m</title>
  <link rel="stylesheet" href="../../css/font.css">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/mngr_component.css">
  <link rel="stylesheet" href="../../css/mngr_contents.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    type="text/css">
</head>

<body>

  <!-- 모바일 전체 Wrap -->
  <div class="m-academy-mngr-Wrap">



    <!-- ●●●●●●●●●●● container 페이지 반복틀(공통영역) 시작 ●●●●●●●●●●● -->
    <div class="container">



      <!-- 원생_과제_m -->
      <div class="content">

        <div class="m-listTopSetBox">
          <span class="Totaltxt">
            <div class="t-checkbox checkbox01">
              <input type="checkbox" name="allChecked" id="allChecked">
              <label for="allChecked"></label>
            </div>
            총 <strong>1</strong>건
          </span>
          <div class="btn-set">
            <button type="button" class="t-button-xs t-button-white t-button-red-bd">선택삭제</button>
            <button type="button" class="t-button-xs t-button-orange">개별과제 등록</button>
          </div>
        </div>

        <!-- 리스트 시작 -->
        <div class="m-list-brdAlarm alarmCont">
          
          <!-- listBox -->
          <div class="listBox">

            <!-- 알림대상 부분 -->
            <div class="brdBtnBox">
              <p class="alarm-tg">
                <i class="i-a-check"></i>
                <span class="ml3">알림대상</span>
              </p>
              <div class="slash-txt-list">
                <span>전체</span>
              </div> 
              <button type="button" class="greyiconBtn go-view">
                <i class="i-plus"></i>
              </button>
            </div> 
            <!-- /알림대상 부분 -->

            <div class="listBox-top">
              <div class="smallBox-wrap">
                <div class="t-checkbox checkbox01">
                  <label>
                    <input type="checkbox"> 
                    <span class="spanLabel"></span>
                  </label>
                </div>
                <div class="smallBox">전체</div>
                <div class="smallBox opt-course">공지사항</div>
              </div>

              <div class="clsBox">
                 <!-- 게시글 제목 --> 
                 <a class="writingNm list-title">썸네일</a> 
                 <!-- 댓글표기 추가 25.09.10 -->
                <div class="cmt"><span class="blind">댓글</span>0</div>
              </div>

              <div class="storageWrap">
                <ul class="bar-txt-list">
                  <li>
                    <div class="rBtnbox">
                      <div class="imgnum">2</div>
                      <div class="filenum">2</div>
                      <div class="linknum">0</div> 
                    </div>
                  </li> 
                  <!-- 파일/링크 용량 추가 25.09.10 -->
                  <li><b class="pc-orange3">120.5MB</b></li>
                </ul>
              </div>
            </div>
            <div class="m-brd-box">
              <ul class="bar-txt-list">
                <li>통통통001</li>
                <li>2025-07-11</li>
              </ul>
            </div>
          </div> 
          <!-- /listBox -->
          
        </div>
        <!-- /리스트 -->



      </div>
      <!-- /원생_과제_m -->




    </div>
    <!-- ●●●●●●●●●●● container 페이지 반복틀(공통영역) 끝 ●●●●●●●●●●● -->




    <div class="footer-fixed">
      <ul>
        <li class="btn-gohome"><button type="button" class="button">
            홈</button>
        </li>
        <li class="btn-allmenu"><button type="button" class="button">
            전체메뉴</button>
        </li>
        <li class="btn-srchpp"><button type="button" class="button">
            원생검색</button>
        </li>
        <li class="btn-mypage"><button type="button" class="button">
            마이페이지</button>
        </li>
      </ul>
    </div>





  </div>
  <!-- 모바일 전체 Wrap 끝 -->




</body>

</html>
