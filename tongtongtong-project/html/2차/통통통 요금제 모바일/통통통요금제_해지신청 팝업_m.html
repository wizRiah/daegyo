<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title></title>
  <link rel="stylesheet" href="../../../css/font.css">
  <link rel="stylesheet" href="../../../css/common.css">
  <link rel="stylesheet" href="../../../css/mngr_component.css">
  <link rel="stylesheet" href="../../../css/mngr_contents.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    type="text/css">
</head>

<body>

  <!-- 모바일 전체 Wrap -->
  <div class="m-academy-mngr-Wrap">

    <div class="container">




      <!-- ●●●●●●●●●●● 팝업 영역 시작 ●●●●●●●●●●● -->
      <div class="t-popup-wrap">
        <div class="t-popup">


          <div class="pop-body">
            <div class="pop-container">


              <div class="pop-cont ratePlan validator rate ratePop">
                <p class="rateTit">해지신청<b class="orange-txt"> Check Point</b></p>
                <ul class="t-bullet-01 contText color3 mb20">
                  <li>해지신청을 위해서는 <b>"회차 수강관리"</b>기능의 사전 정리가 필요합니다.</li>
                  <li class="pc-text-1">회차 수강관리 기능을 이용해 운영중인 수강반을 종강처리 후 다시 해지신청을 진행해 주세요.</li>
                </ul>
                <div class="box-bg mb20">
                  <b class="fs15 pc-text-1">회차 수강반</b>
                  <ul class="t-bullet-01 contText">
                    <li>
                      대분류 &gt; 중분류 &gt; <b class="pt-color">회차 기준 1반</b>
                    </li>
                    <li>대분류 &gt; 중분류 &gt; <b class="pt-color">회차 기준 2반</b> 외 <b class="pt-color">00개</b>반이 <b
                        class="pt-color">회차 수강관리</b>로 운영
                    </li>
                  </ul>
                </div>
                <div class="btn-set">
                  <button type="button" class="t-button-sm t-button-bora1">반 관리 메뉴에서 회차 수강반 확인</button>
                </div>          
              </div>

              
            </div>
          </div>

           <button type="button" class="close"></button>


        </div>


      </div>
      <!-- ●●●●●●●●●●● 팝업 영역 끝 ●●●●●●●●●●● -->


      <!-- 팝업 백그라운드 -->
      <div class="m-popup-bg"></div>











    </div>




  </div>
  <!-- 모바일 전체 Wrap 끝 -->


</body>

</html>
