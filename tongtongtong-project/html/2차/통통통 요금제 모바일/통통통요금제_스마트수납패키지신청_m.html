<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title></title>
  <link rel="stylesheet" href="../../../css/font.css">
  <link rel="stylesheet" href="../../../css/common.css">
  <link rel="stylesheet" href="../../../css/mngr_component.css">
  <link rel="stylesheet" href="../../../css/mngr_contents.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    type="text/css">
</head>

<body>

  <!-- 모바일 전체 Wrap -->
  <div class="m-academy-mngr-Wrap">



    <!-- ●●●●●●●●●●● container 페이지 반복틀(공통영역) 시작 ●●●●●●●●●●● -->
    <div class="container">


      <!-- ●●●●●●●●●●● 팝업 영역 시작 ●●●●●●●●●●● -->

      <div class="t-popup-wrap">
        <div class="t-popup popup-goback">
          <div class="pop-header">
            <p class="pop-title">스마트 수납 패키지</p>
          </div>
          <div class="pop-body">
            <div class="pop-container">


              <div class="pop-cont ratePlan validator rate">
                <p class="rateTit"><b class="pt-color">스마트 수납 패키지</b>가 적용됩니다.</p>
                <ul class="t-bullet-01 contText mb20">
                  <li>
                    <b class="pt-color">스마트 수납 패키지</b><b>로 누락없는 수납업무를 이용해 보세요.</b></li>
                  <li>
                    <b class="pt-color">스마트 수납 패키지</b><b>는 신청당월은 무료 입니다.</b> (2025년 <b class="pc-red2">11월</b> 청구)</li>
                  <li>
                    <b class="pt-color">스마트 수납 패키지</b> 적용버튼 클릭 시 패키지가 바로 적용됩니다.
                  </li>
                </ul>
                <div class="box-bg flex gap20 flex-start">
                  <b class="fs15 pc-text-1">적용기능</b>
                  <ul class="t-bullet-01 contText mt0">
                    <li>청구서 자동생성</li>
                    <li>회차 수강관리</li>
                    <li>수강료 분납</li>
                  </ul>
                </div>
              </div>



            </div>
            <!-- end pop-container-->


            
            <div class="bt-btnbox">
              <button type="button" class="registbtn">해지신청 접수</button><button type="button" class="canclebtn">취소</button>
            </div>


          </div>

          <button type="button" class="goback"></button>

        </div>
      </div>
      <!-- ●●●●●●●●●●● 팝업 영역 끝 ●●●●●●●●●●● -->






    </div>
    <!-- ●●●●●●●●●●● container 페이지 반복틀(공통영역) 끝 ●●●●●●●●●●● -->





  </div>
