<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title></title>
  <link rel="stylesheet" href="../../../css/font.css">
  <link rel="stylesheet" href="../../../css/common.css">
  <link rel="stylesheet" href="../../../css/mngr_component.css">
  <link rel="stylesheet" href="../../../css/mngr_contents.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    type="text/css">
</head>

<body>

  <!-- 모바일 전체 Wrap -->
  <div class="m-academy-mngr-Wrap">



    <!-- ●●●●●●●●●●● container 페이지 반복틀(공통영역) 시작 ●●●●●●●●●●● -->
    <div class="container">


      <!-- ●●●●●●●●●●● 팝업 영역 시작 ●●●●●●●●●●● -->

      <div class="t-popup-wrap">
        <div class="t-popup popup-goback">
          <div class="pop-header">
            <p class="pop-title">스마트 수납 패키지</p>
          </div>
          <div class="pop-body">
            <div class="pop-container">

              <div class="pop-cont ratePlan validator rate">
                <p class="rateTit"><b class="pt-color">스마트 수납 패키지</b> 해지신청이 접수 되었습니다.</p>
                <div class="box-bg">
                  <div><b class="fs15 pc-text-1">해지신청 전</b><b class="orange-txt"> Check Point</b></div>
                  <ul class="t-bullet-01 contText">
                    <li>당월말까지는 패키지가 유지되고, 익월부터 사용할 수 없습니다.</li>
                    <li>회차 수강관리를 이용중인 경우, 수강중인 회차반을 종강처리 해야 합니다.</li>
                  </ul>
                </div>
                <ul class="t-bullet-01 contText fs12">
                  <li>스마트 수납 패키지를 해지 하시면 반복업무를 수동으로 처리 해야 합니다.</li>
                  <li>취소를 클릭하시면 해지신청은 철회되고 계속 이용하실 수 있습니다.</li>
                </ul>
              </div>


            </div>
            <!-- end pop-container-->



            <div class="bt-btnbox">
              <button type="button" class="registbtn">해지신청 접수</button><button type="button"
                class="canclebtn">취소</button>
            </div>


          </div>

          <button type="button" class="goback"></button>

        </div>
      </div>
      <!-- ●●●●●●●●●●● 팝업 영역 끝 ●●●●●●●●●●● -->






    </div>
    <!-- ●●●●●●●●●●● container 페이지 반복틀(공통영역) 끝 ●●●●●●●●●●● -->





  </div>
  <!-- 모바일 전체 Wrap 끝 -->




</body>

</html>
