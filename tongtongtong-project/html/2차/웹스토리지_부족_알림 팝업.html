<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>웹스토리지_부족_알림 팝업</title>
  <link rel="stylesheet" href="../../css/font.css">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/mngr_component.css">
  <link rel="stylesheet" href="../../css/mngr_contents.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    type="text/css">
</head>

<body>

  <!-- PC 전체 Wrap -->
  <div class="academy-mngr-Wrap">


    <div class="t-popup-wrap">
      <div class="t-popup ui-draggable" style="width: 400px;">
        <div class="pop-header ui-draggable-handle" style="cursor: move;border: 0;">
          <p class="pop-title">웹 스토리지 부족 알림</p>
        </div>
        <div class="pop-body">
          <div class="pop-container">


            <!-- 팝업 컴포넌트에 여기부터 넣어주세여 -->
            <!-- pc 팝업 width값 400px로 지정해주세용 -->
            <div class="pop-cont new storage">
              <p class="main-tit mb15">웹 스토리지 부족으로<br>파일 등록이 불가 합니다.</p>
              <p class="contText t-line-hgt20 h-txt-c mb15">웹 스토리지가 부족하여 더 이상 첨부 파일 등록이 불가 합니다.</p>
              <div class="box-bg">
                <ul class="t-bullet-01">
                  <li>스토리지 보유량 : <b class="blue">11GB</b></li>
                  <li>사용중인 스토리지 : <b class="pc-orange3">2GB</b></li>
                  <li>잔여 스토리지 : <b class="pc-orange3">2GB</b></li>
                </ul>
                <p class="contText t-line-hgt20 mt15 mb15">웹 스토리지를 정리하시거나 웹 스토리지를 추가 하신 후 이용 하시기 바랍니다.</p>

                <button type="button" class="t-button-xs more-arrow2">
                  <i class="more-arrow"></i>
                  <span>웹 스토리지 관리 바로가기</span>
                </button>
                
              </div>
              <div class="btn-set">
                <button type="button" class="t-button-m t-button-grey1">확인</button>
              </div>
            </div>
            <!-- /팝업 컴포넌트에 여기부터 넣어주세여 -->


          </div>

        </div>
        <button type="button" class="close" title="팝업 닫기">
          <i class="p-close"></i>
        </button>
      </div>
    </div>


    <!-- 팝업 뒤 배경 -->
    <div class="pop-bg">
    </div>
    <!-- ●●●●●●●●●●● 팝업 영역 끝 ●●●●●●●●●●● -->





  </div>
  <!-- PC 전체 Wrap 끝 -->



</body>

</html>
