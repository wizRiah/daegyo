<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <title>앨범 서비스 종료 알림 팝업</title>
  <link rel="stylesheet" href="../../css/font.css">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/mngr_component.css">
  <link rel="stylesheet" href="../../css/mngr_contents.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    type="text/css">
</head>

<body>

  <!-- PC 전체 Wrap -->
  <div class="academy-mngr-Wrap">


    <div class="t-popup-wrap">
      <div class="t-popup ui-draggable" style="width: 460px;">
        <div class="pop-header ui-draggable-handle" style="cursor: move;border: 0;">
          <p class="pop-title">앨범 서비스 종료 알림</p>
        </div>
        <div class="pop-body">
          <div class="pop-container">



            <!-- 팝업 컴포넌트에 여기부터 넣어주세여 -->
            <!-- pc 팝업 width값 460px로 지정해주세용 -->
            <div class="pop-cont new">
              <p class="main-tit mb20">앨범 서비스가 종료될 예정입니다.</p>
              <div class="box-bg">
                <p class="contText t-line-hgt20 h-txt-c">
                  <b class="purple">앨범 서비스</b>는 오는 <b class="purple">2025년 7월 31일</b>부로
                  <b class="purple">종료</b>될 예정입니다.<br>앨범 서비스가 종료되기 이전에 앨범 데이터를 백업 받으시기 바랍니다.
                </p>
              </div>

              <div class="btn-set">
                <button type="button" class="t-button-m t-button-grey1">확인</button>
              </div>

            </div>
            <!-- /팝업 컴포넌트에 여기부터 넣어주세여 -->




          </div>

        </div>
        <button type="button" class="close" title="팝업 닫기">
          <i class="p-close"></i>
        </button>
      </div>
    </div>


    <!-- 팝업 뒤 배경 -->
    <div class="pop-bg">
    </div>
    <!-- ●●●●●●●●●●● 팝업 영역 끝 ●●●●●●●●●●● -->





  </div>
  <!-- PC 전체 Wrap 끝 -->



</body>

</html>
