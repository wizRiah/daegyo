<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>사업자 번호 유호성 검증 팝업_m</title>
  <link rel="stylesheet" href="../../css/font.css">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/mngr_component.css">
  <link rel="stylesheet" href="../../css/mngr_contents.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    type="text/css">
</head>

<body>

  <!-- 모바일 전체 Wrap -->
  <div class="m-academy-mngr-Wrap m-mobileEdu-Wrap">



    <!-- ●●●●●●●●●●● container 페이지 반복틀(공통영역) 시작 ●●●●●●●●●●● -->
    <div class="container">


      <!-- ●●●●●●●●●●● 팝업 영역 시작 ●●●●●●●●●●● -->

      <div class="t-popup-wrap">
        <div class="t-popup popup-goback popup-full">
          <div class="pop-header">
            <p class="pop-title">결제하기</p>
          </div>
          <div class="pop-body">
            <div class="pop-container">




              <div class="pop-payment">


                <ul class="admin-Ullist">
                  <li>납부하고자 하는 내역을 확인하세요.</li>
                  <li>기타 문의사항은 학원으로 연락주시면 안내해 드리겠습니다.</li>
                </ul>
                <div class="box-bd-bg urlPayWrap">
                  <ul class="box-bd-cont">
                    <li>
                      <p class="box-bd-tit">원생명</p>
                      <div>숀빈 <span>(숀빈)</span></div>
                    </li>
                    <li>
                      <div class="flex-set flex-between wd100">
                        <p class="box-bd-tit">결제내역</p>

                      </div>
                      <div class="box-bd-bg info url-item-wrap pay-box wd100">
                        <ul class="box-bd-cont t-checkbox checkbox01">
                          <li><label for="482f73664774787a446e466c344b6b2f5862665851673d3d" class="box-bg">
                              <ul class="url-item">
                                <!-- 수강료 -->
                                <li><span class="box-bd-tit">결제유형</span>수강료</li>
                                <li><span class="box-bd-tit">반명</span>터키문화의이해</li>
                                <li><span class="box-bd-tit">수강년월</span>2024년 08월</li>
                                <li><span class="box-bd-tit">금액</span>38,600원</li>
                              </ul><span class="spanLabel"></span>
                            </label></li>
                        </ul>
                      </div>
                    </li>
                    <li>
                      <p class="box-bd-tit">결제일자</p> 2025년 11월 14일
                    </li>
                    <li>
                      <p class="box-bd-tit">결제대상금액</p>
                      <p class="pc-red text-medium">38,600 원</p>
                    </li>
                    <li>
                      <p class="box-bd-tit">휴대폰번호</p>
                      <div class="wd100 gap5 input-btn-wrap"><input type="text" class="txtfield-basic h-txt-c"
                          maxlength="3" placeholder="앞번호" required="" inputmode="numeric"> -
                        <input type="text" class="txtfield-basic h-txt-c" maxlength="4" placeholder="중간번호"
                          id="inputTelno2" required="" inputmode="numeric"> -
                        <input type="text" class="txtfield-basic h-txt-c" maxlength="4" placeholder="뒷번호"
                          id="inputTelno3" required="" inputmode="numeric"></div>
                    </li>
                  </ul>
                </div>



                <!-- 결제수단 추가 25.11.14 -->
                <div class="pay-way">
                  <p class="sub-tit">현금영수증</p>
                  <div class="box-bg">
                    <div class="t-radio-01">
                      <input type="radio" id="link_01" name="link">
                      <label for="link_01"><span class="rchk"></span>간편결제</label>
                      <input type="radio" id="link_01_2" name="link">
                      <label for="link_01_2"><span class="rchk"></span>앱 카드결제</label>
                      <input type="radio" id="link_01_2" name="link">
                      <label for="link_01_2"><span class="rchk"></span>온라인PG (신용/체크카드)</label>
                    </div>
                  </div>
                </div>
                <!-- /결제수단 추가 25.11.14 -->




              </div>



            </div>




            <div class="bt-btnbox">
              <button type="button" class="registbtn">결제</button>
              <button type="button" class="canclebtn">취소</button>
            </div>


          </div>

          <button type="button" class="close"></button>

        </div>
      </div>
      <!-- ●●●●●●●●●●● 팝업 영역 끝 ●●●●●●●●●●● -->






    </div>
    <!-- ●●●●●●●●●●● container 페이지 반복틀(공통영역) 끝 ●●●●●●●●●●● -->





  </div>
  <!-- 모바일 전체 Wrap 끝 -->




</body>

</html>
