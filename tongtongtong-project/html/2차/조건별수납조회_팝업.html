<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title></title>
  <link rel="stylesheet" href="../../css/font.css">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/mngr_component.css">
  <link rel="stylesheet" href="../../css/mngr_contents.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    type="text/css">
</head>

<body>

  <!-- PC 전체 Wrap -->
  <div class="academy-mngr-Wrap">


    <div class="t-popup-wrap">
      <div class="t-popup ui-draggable" style="width: 788px;">
        <div class="pop-header ui-draggable-handle" style="cursor: move;border: 0;">

          <!-- 기존 팝업 컴포넌트에서 - 헤더>타이틀부분 변경해야함.. -->
          <div class="pop-title">
            <span class="labels">재원생</span>
            <ul class="barTxt">
              <li>홍길동
              </li>
              <li>중등부 2학년 수학반
              </li>
            </ul>
          </div>

        </div>


        <div class="pop-body">
          <div class="pop-container">

           
            <!-- pc 팝업 width값 788px로 지정해주세용 -->
            <div class="pop-cont new condition">

              <p class="pc-bora1 fs14">· 수강년월 : <b>2023.07</b></p>
              <table class="t-basic-1 test">
                <thead>
                  <tr>
                    <th>수납일자</th>
                    <th>수납유형</th>
                    <th>대상금액</th>
                    <th>청구금액</th>
                    <th>할인금액</th>
                    <th>실 청구금액</th>
                    <th>상태</th>
                    <th>비고/할인사유</th>
                  </tr>
                </thead>

                <tbody>
                  <tr>
                    <td>2023-11-30</td>
                    <td>수강료</td>

                    <td class="txt-r"><b>100,000</b>원</td>
                    <!-- 청구금액 -->
                    <td class="txt-r"><b>100,000</b>원</td>
                    <!-- 할인금액 -->
                    <td class="txt-r"><b>100,000</b>원</td>
                    <!-- (실)청구금액 -->
                    <td class="txt-r black-b"><b>100,000</b>원</td>
                    <!-- 상태 -->
                    <td>
                      <p class="opt-charge">완납</p>
                    </td>

                    <!-- 비고 -->
                    <td>
                      <div class="reson-wrap">
                        <div class="reson-i"></div>
                        <div class="reson-tip"> 분납 후 자동생성</div>
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td>2023-11-30</td>
                    <td>수강료</td>

                    <td class="txt-r"><b>100,000</b>원</td>
                    <!-- 청구금액 -->
                    <td class="txt-r"><b>100,000</b>원</td>
                    <!-- 할인금액 -->
                    <td class="txt-r"><b>100,000</b>원</td>
                    <!-- (실)청구금액 -->
                    <td class="txt-r black-b pc-red2"><b>-100,000</b>원</td>
                    <!-- 상태 -->
                    <td>

                      <p>분납</p>
                    </td>

                    <!-- 비고 -->
                    <td>
                      <div class="reson-wrap">
                        <div class="reson-i"></div>
                        <div class="reson-tip"> 분납 후 자동생성</div>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>


            </div>
            

          </div>

        </div>
        <button type="button" class="close" title="팝업 닫기">
          <i class="p-close"></i>
        </button>
      </div>
    </div>


    <!-- 팝업 뒤 배경 -->
    <div class="pop-bg">
    </div>
    <!-- ●●●●●●●●●●● 팝업 영역 끝 ●●●●●●●●●●● -->





  </div>
  <!-- PC 전체 Wrap 끝 -->



</body>

</html>
