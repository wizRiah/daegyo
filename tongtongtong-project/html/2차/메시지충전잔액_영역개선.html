<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title></title>
  <link rel="stylesheet" href="../../css/font.css">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/mngr_component.css">
  <link rel="stylesheet" href="../../css/mngr_contents.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" type="text/css">
</head>

<body>

  <!-- PC 전체 Wrap -->
  <div class="academy-mngr-Wrap">



    <!-- ●●●●●●●●●●● container 페이지 반복틀(공통영역) 시작 ●●●●●●●●●●● -->
    <div class="container">




      <!-- 페이지 컨텐츠 시작 -->
      <div class="content sub">


        <div class="main-cont">
    
          <div class="location-wrap">
            <p class="top-title">직원 SMS </p> 
            <!-- location -->
            <ul class="location">
              <li>
                <p>home</p>
              </li>
              <li>커뮤니티</li>
              <li class="">SMS</li>
              <li class="active">직원 SMS </li>
            </ul> 
            <!-- /location -->
          </div>



          <div class="layout-wrap">


            <!-- 메시지 충전잔액 영역 개선 -->
            <div class="textBox sms_charge">
              <img class="money-i" src="/images/i_money_m.png" alt="">
              <span class="fs14 pc-text-1 ml10">메시지 충전잔액 :</span><span class="numText ml10">
                <b class="pc-orange3">300,000</b>
                <span class="pc-grey82 fs16">원</span>
              </span>
              <button type="button" class="t-button-sm t-button-orange2 more-arrow2">
                <i class="more-arrow"></i>
                <span>메시지 충전하러 가기</span>
              </button>
            </div>
            <!-- /메시지 충전잔액 영역 개선 -->



            <div class="layout-wrap col3 colauto no-wrap">
              <div class="box-bg box-bg-02 flex-1">
                <div class="tit-bg">
                  <p class="tit-bg-txt">발송대상</p>
                </div>
              </div> 
              <div class="box-bg box-bg-02 flex-1">
                <div class="tit-bg">
                  <p class="tit-bg-txt">문자</p>
                </div>
              </div>
              <div class="box-bg box-bg-02 flex-grow-0 flex-shrink-0" style="flex-basis: 335px;">
                <div class="tit-bg">
                  <p class="tit-bg-txt">설정</p>
                </div>
              </div>
            </div>
          </div> 



        </div>



      </div>
      <!-- 페이지 컨텐츠 끝 -->



    </div>
    <!-- ●●●●●●●●●●● container 페이지 반복틀(공통영역) 끝 ●●●●●●●●●●● -->



  </div>
  <!-- PC 전체 Wrap 끝 -->



</body>

</html>
