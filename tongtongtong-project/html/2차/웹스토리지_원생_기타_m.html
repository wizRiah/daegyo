<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

  <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>웹스토리지_원생_기타_m</title>
  <link rel="stylesheet" href="../../css/font.css">

  <link rel="stylesheet" href="../../css/mngr_contents.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    type="text/css">
</head>

<body>

  <!-- 모바일 전체 Wrap -->
  <div class="m-academy-mngr-Wrap">



    <!-- ●●●●●●●●●●● container 페이지 반복틀(공통영역) 시작 ●●●●●●●●●●● -->
    <div class="container">





      <!-- ●●●●●●●●●●● 팝업 영역 시작 ●●●●●●●●●●● -->
      <div class="t-popup-wrap">
        <div class="t-popup popup-goback">
          <div class="pop-header">
            <p class="pop-title">원생-기타 상세조회</p>
          </div>
          <div class="pop-body">
            <div class="pop-container">



              <!-- 웹스토리지_원생_기타_m -->
              <div class="pop-cont">


                <div class="m-list-storage storageWrap">

                  <div class="p020">
                    <div class="h-txt-c dash pb30">
                      <p class="num-txt pc-text-1 fs20 mt0">원생-기타 <span class="pc-orange3 fs26">1.2GB</span> 사용중</p>
                    </div>
                  </div>


                  <div class="m-listTopSetBox">
                    <div class="Totaltxt">
                      <div class="t-checkbox checkbox01">
                        <input type="checkbox" name="allChecked" id="allChecked">
                        <label for="allChecked"></label>
                      </div>총 <strong>2</strong>건
                    </div>
                    <div class="button-wrap items-end new">
                      <button type="button" class="t-button-xs t-button-red-bd">선택 삭제</button>
                      <button type="button" class="t-button-xs t-button-bora6">첨부 용량순</button>
                      <button type="button" class="t-button-xs t-button-bora6">원생명 순</button>
                    </div>
                  </div>



                  <div class="listBoxwrap">


                      <div class="listBox">
                        <div class="checkWrap">

                          <div class="t-checkbox checkbox01">
                            <label>
                              <input type="checkbox">
                              <span class="spanLabel"></span>
                            </label>
                          </div>

                          <span>원생-기타</span>
                        </div>

                        <div class="clsName">홍길동 (홍길동이)</div>

                        <a class="writingNm list-title">게시글 명 게시글 명 게시글 명</a>

                        <ul class="bar-txt-list">
                          <li><span>첨부파일 :</span> 1</li>
                          <li><b class="pc-orange3">120.5MB</b></li>
                        </ul>
                        <ul class="bar-txt-list nobar">
                          <li><span>작성자 : </span>홍길동</li>
                          <li><span>작성일 : </span>2025-07-01</li>
                        </ul>
                      </div>


                      <div class="listBox">
                        <div class="checkWrap">

                          <div class="t-checkbox checkbox01">
                            <label>
                              <input type="checkbox">
                              <span class="spanLabel"></span>
                            </label>
                          </div>

                          <span>원생-기타</span>
                        </div>

                        <div class="clsName">홍길동 (홍길동이)</div>
                        <a class="writingNm list-title">게시글 명 게시글 명 게시글 명</a>

                        <ul class="bar-txt-list">
                          <li><span>첨부파일 :</span> 1</li>
                          <li><b class="pc-orange3">120.5MB</b></li>
                        </ul>

                        <ul class="bar-txt-list nobar">
                          <li><span>작성자 : </span>홍길동</li>
                          <li><span>작성일 : </span>2025-07-01</li>
                        </ul>
                      </div>
                      
                      
                      <button type="button" class="m-readmore">더보기<i class="m-arrow-b"></i></button>


                  </div>

                </div>
              </div>
              <!-- /웹스토리지_원생_기타_m -->





            </div>
            <!-- end pop-container-->


          </div>

          <button type="button" class="goback"></button>

        </div>
      </div>
      <!-- ●●●●●●●●●●● 팝업 영역 끝 ●●●●●●●●●●● -->


    </div>
    <!-- ●●●●●●●●●●● container 페이지 반복틀(공통영역) 끝 ●●●●●●●●●●● -->










  </div>

</html>
