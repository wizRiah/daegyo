<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <title>웹스토리지_용량확인 팝업</title>
  <link rel="stylesheet" href="../../css/font.css">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/mngr_component.css">
  <link rel="stylesheet" href="../../css/mngr_contents.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    type="text/css">
</head>

<body>

  <!-- PC 전체 Wrap -->
  <div class="academy-mngr-Wrap">


    <div class="t-popup-wrap">
      <div class="t-popup ui-draggable" style="width: 520px;">
        <div class="pop-header ui-draggable-handle" style="cursor: move;border: 0;">
          <p class="pop-title">웹 스토리지 용량 확인</p>
        </div>
        <div class="pop-body">
          <div class="pop-container">


            <!-- 팝업 컴포넌트에 여기부터 넣어주세여 -->
            <!-- pc 팝업만 width값 520px로 지정해주세용 -->
            <div class="pop-cont new storage">
              <p class="main-tit mb15">master 요금제를 이용해 주셔서 감사합니다.</p>
              <p class="contText t-line-hgt20 h-txt-c mb15">마스터 요금제에는 
                <b class="purple">"앨범"</b> 서비스가 포함되어 있습니다. 
                <b class="purple">"앨범"</b> 서비스 이용 시 이미지 저장으로 인해 웹 스토리지 사용 용량이 증가할 수 있습니다.
              </p>

              <div class="box-bg">
                <p>현재 사용중인 웹 스토리지 용량은 <b class="pc-orange3">2GB</b> 입니다.</p>
                <p class="contText t-line-hgt20 mt10 mb20">웹 스토리지 용량이 부족할 경우, 첨부 파일 등록이 제한될 수 있으니 저장 공간을 꼭 확인해 주세요.</p>
                <button type="button" class="t-button-xs more-arrow2">
                  <i class="more-arrow"></i>
                  <span>웹 스토리지 관리 바로가기</span>
                </button>
              </div>

              <div class="btn-set">
                <button type="button" class="t-button-m t-button-grey1">확인</button>
              </div>
              
            </div>
            <!-- /팝업 컴포넌트에 여기부터 넣어주세여 -->


          </div>

        </div>
        <button type="button" class="close" title="팝업 닫기">
          <i class="p-close"></i>
        </button>
      </div>
    </div>


    <!-- 팝업 뒤 배경 -->
    <div class="pop-bg">
    </div>
    <!-- ●●●●●●●●●●● 팝업 영역 끝 ●●●●●●●●●●● -->





  </div>
  <!-- PC 전체 Wrap 끝 -->



</body>

</html>
