<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>출결앱_출석이력보기 팝업_m</title>
  <link rel="stylesheet" href="../../css/font.css">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/mngr_component.css">
  <link rel="stylesheet" href="../../css/mngr_contents.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    type="text/css">
</head>

<body>

  <!-- 모바일 전체 Wrap -->
  <div class="m-academy-mngr-Wrap m-mobileAtd-wrap">

    <div class="container">




      <!-- ●●●●●●●●●●● 팝업 영역 시작 ●●●●●●●●●●● -->
      <div class="t-popup-wrap m-popup popup-slide active">
        <div class="t-popup popup-goback popup-full">
          <div class="pop-header">
            <p class="pop-title">출석이력보기</p>
          </div>

          <div class="pop-body">
            <div class="pop-container">


              <!-- 팝업 컴포넌트에 이 부분 넣기 -->
              <div class="pop-cont m-atd">
                <div class="m-list-atd">
                  <ul class="attend-list">
                    <li>
                      <p class="time-box">오전<br>10 : 36</p>
                      <div class="atd-infoSet">
                        <div class="at-name">
                          <p class="at-grade"></p>
                          <p>스케주리</p>
                        </div>
                        <p class="at-status">등원</p>
                      </div>
                    </li>
                    <li>
                      <p class="time-box">오전<br>10 : 36</p>
                      <div class="atd-infoSet">
                        <div class="at-name">
                          <p class="at-grade">스케줄 확인 2</p>
                          <p>스케주리</p>
                        </div>
                        <p class="at-status">시작</p>
                      </div>
                    </li>
                  </ul>
                </div>
              </div>
              <!-- /팝업 컴포넌트에 요 부분 넣기 -->



            </div>



          </div>

          <button type="button" class="close"></button>

        </div>


      </div>
      <!-- ●●●●●●●●●●● 팝업 영역 끝 ●●●●●●●●●●● -->


      <!-- 팝업 백그라운드 -->
      <div class="m-popup-bg"></div>











    </div>




  </div>
  <!-- 모바일 전체 Wrap 끝 -->


</body>

</html>
