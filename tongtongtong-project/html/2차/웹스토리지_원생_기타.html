<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <title>웹스토리지_원생_기타</title>
  <link rel="stylesheet" href="../../css/font.css">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/mngr_component.css">
  <link rel="stylesheet" href="../../css/mngr_contents.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    type="text/css">
</head>

<body>

  <div class="academy-mngr-Wrap">



    <!-- ●●●●●●●●●●● container 페이지 반복틀(공통영역) 시작 ●●●●●●●●●●● -->
    <div class="container">




      <!-- 페이지 컨텐츠 시작 -->
      <div class="content sub">



        <div class="main-cont">




          <div class="layout-wrap storageWrap">

            <div class="textBox textBox03 mb15 mt20">
              <p class="tit pc-text-1 fs26">원생-기타 <span class="fs32 pc-orange3">1.2GB</span> 사용중</p>
            </div>

            <div class="tit-wrap flex-end"><span class="sum">총 0건</span>
              <div class="button-wrap items-end new">
                <button type="button" class="t-button-xs t-button-red-bd">선택삭제</button>
                <button type="button" class="t-button-xs t-button-bora6">첨부 용량순</button>
                <button type="button" class="t-button-xs t-button-bora6">원생명 순</button>
                <select class="">
                  <option value="10">10건</option>
                  <option value="20">20건</option>
                </select>
              </div>
            </div>

            <table class="t-basic-1 test">
              <colgroup>
                <col style="width:60px">
                <col style="width:58px;">
                <col style="width:120px;">
                <col style="width:176px;">
                <col>
                <col style="width:82px;">
                <col style="width:95px;">
                <col style="width:74px;">
                <col style="width:92px;">
              </colgroup>
              <thead>
                <tr>
                  <th>
                    <div class="t-checkbox checkbox01">
                      <label>
                        <input type="checkbox" name="" id="" disabled="">
                        <span class="spanLabel"></span>
                      </label>
                    </div>
                  </th>
                  <th>No</th>
                  <th>구분</th>
                  <th>원생명</th>
                  <th>게시글 명</th>
                  <th>첨부파일</th>
                  <th>
                    <div class="tggl-wrap">
                      첨부용량<button type="button" class="tggl-updwn down" title="내림차순"></button>
                    </div>
                  </th>
                  <th>작성자</th>
                  <th>작성일</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>
                    <div class="t-checkbox checkbox01">
                      <label>
                        <input type="checkbox" name="" id="" disabled="">
                        <span class="spanLabel"></span>
                      </label>
                    </div>
                  </td>
                  <td>20</td>
                  <td>원생-기타</td>
                  <td>홍길동 (홍길동이)</td>
                  <td>
                    <div class="workTDWrap">
                      <a href="#" class="workNm ml0">게시글 명 게시글 명 게시글 명 게시글 명 게시글 명 게시글 명 게시글 명 게시글 명</a>
                    </div>
                  </td>
                  <td>
                    <div class="rBtnbox">
                      <div class="filenum">0</div>
                    </div>
                  </td>
                  <td><b class="pc-orange3">125MB</b></td>
                  <td>홍길동</td>
                  <td>2023-06-01</td>
                </tr>
                <tr>
                  <td colspan="9">검색된 데이터가 없습니다.</td>
                </tr>
              </tbody>
            </table>



            <div class="t-pagination mt20" aria-disabled="false" role="navigation">
              <div class="t-pagination-content">
                <button class="t-btn non-selectable disabled" tabindex="-1"
                  type="button" aria-label="1" aria-current="false" aria-disabled="true"><span class="t-btn-content"><i
                      class="t-icon material-icons notranslate" aria-hidden="true"
                      role="img">keyboard_double_arrow_left</i></span></button> <button
                  class="t-btn non-selectable disabled" tabindex="-1" type="button" aria-label="1" aria-current="false"
                  aria-disabled="true"><span class="t-btn-content"><i class="t-icon material-icons notranslate"
                      aria-hidden="true" role="img">keyboard_arrow_left</i></span></button>
                <div class="h-pagination-middle flex justify-center"><button
                    class="t-btn-outline t-btn non-selectable t-btn-actionable" tabindex="0" type="button"
                    aria-label="1" aria-current="true"><span class="t-btn-content"><span
                        class="block">1</span></span></button></div> <button
                  class="t-btn non-selectable t-btn-actionable disabled" tabindex="0" type="button" aria-label="0"
                  aria-current="false"><span class="t-btn-content"><i class="t-icon material-icons notranslate"
                      aria-hidden="true" role="img">keyboard_arrow_right</i></span></button> <button
                  class="t-btn non-selectable t-btn-actionable disabled" tabindex="-1" type="button" aria-label="4"

                      aria-hidden="true" role="img">keyboard_double_arrow_right</i></span></button>
              </div>
            </div>


            <div class="btn-set btmBtnBox"> 
              <button type="button" class="t-button-xs t-button-bora6">목록</button> 
            </div>


          </div>





        </div>


      </div>
      <!-- 페이지 컨텐츠 끝 -->







    </div>
    <!-- ●●●●●●●●●●● container 페이지 반복틀(공통영역) 끝 ●●●●●●●●●●● -->



  </div>
