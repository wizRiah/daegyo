<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>부가서비스 상세보기_m_공통</title>
  <link rel="stylesheet" href="../../css/font.css">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/mngr_component.css">
  <link rel="stylesheet" href="../../css/mngr_contents.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    type="text/css">
</head>

<body>

  <!-- 모바일 전체 Wrap -->
  <div class="m-academy-mngr-Wrap">



    <!-- ●●●●●●●●●●● container 페이지 반복틀(공통영역) 시작 ●●●●●●●●●●● -->
    <div class="container">


      <!-- ●●●●●●●●●●● 팝업 영역 시작 ●●●●●●●●●●● -->

      <div class="t-popup-wrap">
        <div class="t-popup popup-goback">
          <div class="pop-header">
            <p class="pop-title">비대면 간편결제 (후불)</p>
          </div>
          <div class="pop-body">
            <div class="pop-container">



              <div class="pop-cont validator detail">
                <img class="ml3" src="/images/b-recom.svg" alt="추천item">
                <ul class="t-bullet-01 contText pc-text-1">
                  <li>학부모님이 학원에 방문 없이도 언제 어디서나 간편하게 결제할 수 있습니다.</li>

                  <li><b>0.5% 최저 수수료</b>로 비대면 간편결제 서비스를 제공합니다. </li>

                  <li>도달률이 높은 카카오톡 또는 문자메세지로 결제 링크가 전송되어 미납률이 낮춰질 가능성이 있습니다.</li>
                  <li class="orange-txt">통통통 사용료 청구서에 포함되어 함께 청구 됩니다.</li>
                  <li class="orange-txt">결제 연동이 가능한 VAN사와 별도 계약이 필요합니다.</li>
                </ul>
                <div class="box-bg h-txt-c mt20">
                  <div>
                    <span class="fs14 pc-bora1">월 사용료 :</span>
                    <span class="fs26 orange-txt num-txt">후불</span>
                  </div>
                  <p class="mt10 fs12">(통통통basic 사용료 청구서에 포함되어 청구됩니다.)</p>
                </div>
              </div>




            </div>
            <!-- end pop-container-->




          </div>

          <button type="button" class="goback"></button>

        </div>
      </div>
      <!-- ●●●●●●●●●●● 팝업 영역 끝 ●●●●●●●●●●● -->






    </div>
    <!-- ●●●●●●●●●●● container 페이지 반복틀(공통영역) 끝 ●●●●●●●●●●● -->





  </div>
  <!-- 모바일 전체 Wrap 끝 -->




</body>

</html>
