<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>출결앱_출결정보 팝업_m</title>
  <link rel="stylesheet" href="../../css/font.css">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/mngr_component.css">
  <link rel="stylesheet" href="../../css/mngr_contents.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    type="text/css">
</head>

<body>

  <!-- 모바일 전체 Wrap -->
  <div class="m-academy-mngr-Wrap m-mobileAtd-wrap">

    <div class="container">




      <!-- ●●●●●●●●●●● 팝업 영역 시작 ●●●●●●●●●●● -->
      <div class="t-popup-wrap m-popup popup-slide active">
        <div class="t-popup popup-goback popup-full">
          <div class="pop-header">
            
            <!-- 타이틀 부분 구조 변경 -->
            <p class="pop-title"><span>홍길동</span> 원생 출결</p>
          </div>

          <div class="pop-body">
            <div class="pop-container">


              <!-- 팝업 컴포넌트에 이 부분 넣기 -->
              <div class="pop-cont m-atd m-ClsList">
                <div class="m-list-atd">
                  <ul class="attend-list">
                    <!--
                        1) 시작인 경우 statusBtn에 attend, 종료인 경우에 return 클래스 추가
                        2) 비활성화 버튼에 disabled 추가
                        -->

                    <li class="listBox">
                      <div class="at-name"><span>수학 월, 수, 금</span>
                        <p class="at-grade">수학 월, 수, 금<br>오후 1:00 ~ 오후 5:00</p>
                      </div>
                      <div class="btn-set">
                        <button type="button" class="t-button-xs statusBtn attend">시작</button>
                        <button type="button" class="t-button-xs statusBtn return" disabled="">종료</button>
                      </div>
                    </li>
                    <li class="listBox">
                      <div class="at-name"><span>수학 월, 수, 금</span>
                        <p class="at-grade">수학 월, 수, 금<br>오후 1:00 ~ 오후 5:00</p>
                      </div>
                      <div class="btn-set">
                        <button type="button" class="t-button-xs statusBtn attend" disabled="">시작</button>
                        <button type="button" class="t-button-xs statusBtn return">종료</button>
                      </div>
                    </li>
                    <li class="listBox">
                      <div class="at-name"><span>수학 월, 수, 금</span>
                        <p class="at-grade">수학 월, 수, 금<br>오후 1:00 ~ 오후 5:00</p>
                      </div>
                      <div class="btn-set">
                        <button type="button" class="t-button-xs statusBtn attend" disabled="">시작</button>
                        <button type="button" class="t-button-xs statusBtn return" disabled="">종료</button>
                      </div>
                    </li>
                  </ul>
                </div>
              </div>
              <!-- /팝업 컴포넌트에 요 부분 넣기 -->



            </div>



          </div>

          <button type="button" class="close"></button>

        </div>


      </div>
      <!-- ●●●●●●●●●●● 팝업 영역 끝 ●●●●●●●●●●● -->


      <!-- 팝업 백그라운드 -->
      <div class="m-popup-bg"></div>











    </div>




  </div>
  <!-- 모바일 전체 Wrap 끝 -->


</body>

</html>
