<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <title>커뮤니티_앱관리_알림장</title>
  <link rel="stylesheet" href="../../css/font.css">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/mngr_component.css">
  <link rel="stylesheet" href="../../css/mngr_contents.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    type="text/css">
</head>

<body>

  <!-- PC 전체 Wrap -->
  <div class="academy-mngr-Wrap">



    <!-- ●●●●●●●●●●● container 페이지 반복틀(공통영역) 시작 ●●●●●●●●●●● -->
    <div class="container">




      <!-- 페이지 컨텐츠 시작 -->
      <div class="content sub">



        <div class="main-cont">

 

          <!-- 메시지 충전 -->
          <div class="layout-wrap">

            <div class="tit-wrap mt20 mb15">
              <p class="main-tit">웹 스토리지 사용 현황</p>
            </div>
            <div class="textBox textBox03 mb20">
              <div>
                <dl>
                  <dt>웹 스토리지 보유량 :</dt>
                  <dd>
                    <strong class="pc-blue">11.00GB</strong>
                    <span>(무료 1GB 포함)</span>
                  </dd>
                </dl>
              </div>
              <div>
                <dl>
                  <dt>웹 스토리지 사용량 :</dt>
                  <dd>
                    <strong class="pc-orange3">9.50GB</strong>
                  </dd>
                </dl>
              </div>
              <div>
                <dl>
                  <dt>과제 사용량 :</dt>
                  <dd>
                    <strong class="pc-orange3">1.50GB</strong>
                  </dd>
                </dl>
              </div>
            </div>



            <div class="tit-wrap flex-end">
              <button type="button" class="t-button-xs t-button-white t-button-red-bd">선택 삭제</button>
              <div class="button-wrap items-end">
                <button type="button" class="t-button-xs t-button-orange cls-regist"><i class="i-regist2"></i><span class="">등록</span></button>
                <button type="button" class="t-button-xs t-button-white t-button-green-bd">엑셀 받기</button>
                <select class="">
                  <option value="10">10건</option>
                  <option value="20">20건</option>
                  <option value="30">30건</option>
                  <option value="50">50건</option>
                  <option value="100">100건</option>
                </select>
              </div>
            </div>
            <table class="t-basic-1">
              <colgroup>
                <col style="width:60px">
                <col style="width:60px;">
                <col style="width:142px;">
                <col>
                <col style="width:125px;">
                <col style="width:82px;">
                <col style="width:76px;">
                <col style="width:93px;">
              </colgroup>
              <thead>
                <tr>
                  <th>
                    <div class="t-checkbox checkbox01">
                      <label>
                        <input type="checkbox" name="allChecked" id="allChecked" disabled="">
                        <span class="spanLabel"></span>
                      </label>
                    </div>
                  </th>
                  <th>No</th>
                  <th>유형</th>
                  <th>제목</th>
                  <th>파일/링크</th> 
                  <th>용량</th>
                  <th>작성자</th>
                  <th>작성일</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>
                    <div class="t-checkbox checkbox01">
                      <label>
                        <input type="checkbox" name="allChecked" id="allChecked" disabled="">
                        <span class="spanLabel"></span>
                      </label>
                    </div>
                  </td>
                  <td>24</td>
                  <td>행사안내</td>
                  <td>
                    <div class="workTDWrap">
                      <div>
                        <span class="labels">반별</span>
                        <a href="#" class="workNm">반별 중등수학 과제입니다 정상적으로 제출 하시기 바랍니다.</a>
                        <div class="cmt"><span class="blind">댓글</span>2</div>
                      </div>
                    </div>
                  </td>
                  <td>
                    <div class="rBtnbox" style="white-space: nowrap;">
                      <div class="imgnum">0</div> 
                      <div class="filenum">0</div> 
                      <div class="linknum">0</div> 
                    </div>
                  </td>
                  <td><b class="pc-orange3">125MB</b></td>
                  <td>홍길동</td>
                  <td>2023-06-01</td>
                </tr>

                <tr>
                  <td>
                    <div class="t-checkbox checkbox01">
                      <label>
                        <input type="checkbox" name="allChecked" id="allChecked" disabled="">
                        <span class="spanLabel"></span>
                      </label>
                    </div>
                  </td>
                  <td>24</td>
                  <td>동의서수집안내</td>
                  <td>
                    <div class="workTDWrap">
                      <div>
                        <span class="labels reserve">개인</span>
                        <a href="#" class="workNm">개인정보 수집 및 이용에 대한 동의 안내 입니다.</a>
                        <div class="cmt"><span class="blind">댓글</span>2</div>
                      </div>
                    </div>
                  </td>
                  <td>
                    <div class="rBtnbox" style="white-space: nowrap;">
                      <div class="imgnum">0</div> 
                      <div class="filenum">0</div> 
                      <div class="linknum">0</div> 
                    </div>
                  </td>
                  <td><b class="pc-orange3">125MB</b></td>
                  <td>홍길동</td>
                  <td>2023-06-01</td>
                </tr>


                <tr>
                  <td colspan="8">검색된 데이터가 없습니다.</td>
                </tr>
              </tbody>
            </table>


            <div class="t-pagination mt20" aria-disabled="false" role="navigation">
              <div class="t-pagination-content">
                <button class="t-btn non-selectable" tabindex="-1" type="button" aria-label="1" aria-current="false" aria-disabled="true"><span class="t-btn-content"><i class="t-icon material-icons notranslate" aria-hidden="true" role="img">keyboard_double_arrow_left</i></span></button> 
                <button class="t-btn non-selectable" tabindex="-1" type="button" aria-label="1" aria-current="false" aria-disabled="true"><span class="t-btn-content"><i class="t-icon material-icons notranslate" aria-hidden="true" role="img">keyboard_arrow_left</i></span></button>
                <div class="h-pagination-middle flex justify-center">
                  <button class="t-btn-outline t-btn non-selectable t-btn-actionable" tabindex="0" type="button" aria-label="1" aria-current="true">
                    <span class="t-btn-content"><span class="block">1</span></span>
                  </button>
                </div>
                <button class="t-btn non-selectable t-btn-actionable disabled" tabindex="0" type="button" aria-label="0" aria-current="false">
                  <span class="t-btn-content"><i class="t-icon material-icons notranslate" aria-hidden="true" role="img">keyboard_arrow_right</i></span>
                </button>
                <button class="t-btn non-selectable t-btn-actionable disabled" tabindex="-1" type="button" aria-label="0" aria-current="false">
                  <span class="t-btn-content"><i class="t-icon material-icons notranslate" aria-hidden="true" role="img">keyboard_double_arrow_right</i></span>
                </button>
              </div>
            </div>

            




        </div>




      </div>
      <!-- 페이지 컨텐츠 끝 -->







    </div>
    <!-- ●●●●●●●●●●● container 페이지 반복틀(공통영역) 끝 ●●●●●●●●●●● -->



  </div>
  <!-- PC 전체 Wrap 끝 -->



</body>

</html>
