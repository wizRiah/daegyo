<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>상담관리_캘린더형</title>
  <link rel="stylesheet" href="../../css/font.css">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/mngr_component.css">
  <link rel="stylesheet" href="../../css/mngr_contents.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    type="text/css">
</head>

<body>

  <!-- PC 전체 Wrap -->
  <div class="academy-mngr-Wrap">



    <!-- ●●●●●●●●●●● container 페이지 반복틀(공통영역) 시작 ●●●●●●●●●●● -->
    <div class="container">




      <!-- 페이지 컨텐츠 시작 -->
      <div class="content sub">
        <div class="main-cont">


          <div class="layout-wrap consult-mngr">
            <div class="consultCalWrap">
              <button type="button" class="t-button-xs t-button-grey2-bd date-btn date-l"></button>
              <div class="consultCal">
                <span class="date-picker">
                  <div class="dp__main dp__theme_light" data-datepicker-instance="" msgsndngdisabled="false">
                    <div>
                      <div class="dp__input_wrap">
                        <div>
                          <span class="dp__input_icon">
                            <button type="button" style="margin-right: 5px;">
                              <img class="ui-datepicker-trigger" src="/images/datepicker.svg">
                            </button>
                          </span>
                        </div>
                      </div>
                    </div>
                  </div>
                </span>
              </div>

              <button type="button" class="t-button-xs t-button-grey2-bd date-btn date-r"></button>

              <div class="button-wrap flex-center">
                <span class="pc-bora2 t-bullet-02 show mr10">캘린더의 일자 클릭시에도, 상담 등록이 가능합니다.</span>
                <button type="button" class="t-button-xs t-button-orange cls-regist">
                  <i class="i-regist2"></i><span>상담등록</span>
                </button>
              </div>
            </div>

            <div class="textBox textBox03 mb20">
              <div class="colorBG flex flex-center">
                <div class="imgCircle">
                  <img src="/images/consult-img01.svg" alt="">
                </div>
                <p>상담 현황</p>
              </div>
              <div>
                <dl>
                  <dt>09월 상담예약 :</dt>
                  <dd>
                    <strong class="pc-orange3">12</strong>
                    <span>명</span>
                  </dd>
                </dl>
              </div>
              <div>
                <dl>
                  <dt>09월 예약취소 :</dt>
                  <dd>
                    <strong class="pc-text-1">212</strong><span>명</span>
                  </dd>
                </dl>
              </div>
              <div>
                <dl>
                  <dt>09월 완료 :</dt>
                  <dd>
                    <strong>2</strong><span>명</span>
                  </dd>
                </dl>
              </div>
            </div>

            <div class="consult-cal">

            </div>

          </div>
        </div>
      </div>
      <!-- 페이지 컨텐츠 끝 -->







    </div>
    <!-- ●●●●●●●●●●● container 페이지 반복틀(공통영역) 끝 ●●●●●●●●●●● -->



  </div>
  <!-- PC 전체 Wrap 끝 -->



</body>

</html>
