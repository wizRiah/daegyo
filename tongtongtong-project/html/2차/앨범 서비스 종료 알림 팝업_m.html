<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>앨범 서비스 종료 알림 팝업_m</title>
  <link rel="stylesheet" href="../../css/font.css">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/mngr_component.css">
  <link rel="stylesheet" href="../../css/mngr_contents.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    type="text/css">
</head>

<body>

  <!-- 모바일 전체 Wrap -->
  <div class="m-academy-mngr-Wrap">

    <div class="container">


      <!-- ●●●●●●●●●●● 팝업 컴포넌트 영역 시작 ●●●●●●●●●●● -->
      <div class="t-popup-wrap">
        <div class="t-popup">
          <div class="pop-header">
            <p class="pop-title">앨범 서비스 종료 알림</p>
          </div>
          <div class="pop-body">
            <div class="pop-container">


              <!-- 여기부터 추가 -->
              <div class="pop-cont new storage">
                <p class="main-tit mb15">앨범 서비스가 종료될 예정입니다.</p>
                <div class="box-bg">
                  <p class="contText t-line-hgt20 h-txt-c">
                    <b class="purple">앨범 서비스</b>는 오는 <b class="purple">2025년 7월 31일</b>부로
                    <b class="purple">종료</b>될 예정입니다. 앨범 서비스가 종료되기 이전에 앨범 데이터를 백업 받으시기 바랍니다.
                  </p>
                </div>

                <div class="btn-set">
                  <button type="button" class="t-button-m t-button-grey1">확인</button>
                </div>

              </div>
              <!-- /여기부터 추가 -->



            </div>
          </div>
          <button type="button" class="close" title="팝업 닫기"></button>
        </div>
      </div>
      <div class="m-popup-bg"></div>
      <!-- ●●●●●●●●●●● 팝업 컴포넌트 영역 끝 ●●●●●●●●●●● -->




    </div>

  </div>
  <!-- 모바일 전체 Wrap 끝 -->



</body>

</html>
